{% extends "base.html" %}

{% block title %}Game Map - Legacy of Lycia{% endblock %}

{% block content %}
<div class="game-container" x-data="gameState()">
    <div id="map" class="game-map"></div>
</div>
{% endblock %}

{% block extra_scripts %}
<!-- Leaflet JS - Load BEFORE Alpine initializes -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

<script>
// Alpine.js component for game state management
// Define this BEFORE Alpine.js loads (it's deferred in base.html)
document.addEventListener('alpine:init', () => {
    // Initialize global game store
    Alpine.store('game', {
        tick: 0
    });

    Alpine.data('gameState', () => ({
        map: null,
        cities: [],
        worldTick: 0,
        lastKnownTick: 0,
        pollingInterval: null,
        pollingEnabled: false,
        cityMarkers: new Map(), // Track markers for updates

        async init() {
            // Initialize the map
            this.initMap();

            // Load initial data
            await this.loadWorldData();

            // Initialize polling (S2-09)
            await this.initPolling();
        },

        initMap() {
            // Center on ancient Lycia region (modern southwest Turkey)
            // Approximate coordinates: 36.2°N, 29.6°E
            this.map = L.map('map').setView([36.2, 29.6], 9);

            // Use OpenStreetMap tiles (open source!)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19,
                minZoom: 7
            }).addTo(this.map);

            // Optional: Add a legend or overlay showing "Ancient Lycia"
            const lyciaInfo = L.control({ position: 'topright' });
            lyciaInfo.onAdd = function() {
                const div = L.DomUtil.create('div', 'map-legend');
                div.innerHTML = '<h4>Ancient Lycia</h4><p>Southwestern Anatolia</p>';
                return div;
            };
            lyciaInfo.addTo(this.map);
        },

        async loadWorldData() {
            try {
                const response = await fetch('/api/world/snapshot');
                const data = await response.json();

                this.cities = data.cities;
                this.worldTick = data.tick;
                this.lastKnownTick = data.tick;

                // Update global store for tick counter in header
                Alpine.store('game').tick = data.tick;

                // Add city markers to map
                this.addCityMarkers();
            } catch (error) {
                console.error('Failed to load world data:', error);
            }
        },

        addCityMarkers() {
            this.cities.forEach(city => {
                // Create custom icon based on city prosperity
                const iconClass = this.getCityIconClass(city.prosperity);

                const marker = L.circleMarker([city.lat, city.lon], {
                    radius: 8,
                    fillColor: this.getCityColor(city.prosperity, city.unrest),
                    color: '#000',
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8
                });

                // Bind popup with city information
                marker.bindPopup(`
                    <div class="city-popup">
                        <h4>${city.name}</h4>
                        <p><strong>Region:</strong> ${city.region}</p>
                        <p><strong>Prosperity:</strong> ${city.prosperity}</p>
                        <p><strong>Unrest:</strong> ${city.unrest}</p>
                    </div>
                `);

                // Add hover events
                marker.on('mouseover', () => {
                    marker.openPopup();
                });

                marker.on('mouseout', () => {
                    marker.closePopup();
                });

                // Add click event (for future interactions)
                marker.on('click', () => {
                    console.log('City clicked:', city.name);
                    // Future: open detailed city view, manage city, etc.
                });

                marker.addTo(this.map);

                // Add city label
                const label = L.tooltip({
                    permanent: true,
                    direction: 'top',
                    className: 'city-label',
                    offset: [0, -10]
                }).setContent(city.name);

                marker.bindTooltip(label);

                // Track marker for updates (S2-09)
                this.cityMarkers.set(city.id, { marker, city });
            });
        },

        // S2-09: Initialize polling for world updates
        async initPolling() {
            try {
                const response = await fetch('/api/client/config');
                const config = await response.json();

                this.pollingEnabled = config.enable_polling;

                if (this.pollingEnabled) {
                    const intervalMs = config.polling_interval_ms || 3000;
                    console.log(`[S2-09] Polling enabled. Interval: ${intervalMs}ms`);

                    // Start polling
                    this.pollingInterval = setInterval(() => {
                        this.pollForUpdates();
                    }, intervalMs);
                } else {
                    console.log('[S2-09] Polling disabled by config');
                }
            } catch (error) {
                console.error('[S2-09] Failed to initialize polling:', error);
            }
        },

        // S2-09: Poll for world updates since last known tick
        async pollForUpdates() {
            try {
                // Request diff since last known tick
                const response = await fetch(`/api/world/diff?sinceTick=${this.lastKnownTick}`);

                if (!response.ok) {
                    console.error('[S2-09] Failed to fetch diff:', response.statusText);
                    return;
                }

                const diff = await response.json();

                // Check if there are any updates
                if (diff.current_tick === this.lastKnownTick) {
                    // No updates
                    return;
                }

                console.log(`[S2-09] Received updates: tick ${this.lastKnownTick} -> ${diff.current_tick}`);
                console.log(`[S2-09] Changes in ${diff.cities.length} cities, ${diff.total_events} events`);

                // Apply updates to city states
                this.applyDiffUpdates(diff);

                // Update tick tracker
                this.worldTick = diff.current_tick;
                this.lastKnownTick = diff.current_tick;
                Alpine.store('game').tick = diff.current_tick;

            } catch (error) {
                console.error('[S2-09] Error polling for updates:', error);
            }
        },

        // S2-09: Apply diff updates to city markers
        applyDiffUpdates(diff) {
            diff.cities.forEach(cityDiff => {
                const cityData = this.cityMarkers.get(cityDiff.city_id);

                if (!cityData) {
                    console.warn(`[S2-09] Unknown city ID: ${cityDiff.city_id}`);
                    return;
                }

                const { marker, city } = cityData;

                // Apply metric changes
                cityDiff.metric_changes.forEach(change => {
                    if (change.metric === 'prosperity') {
                        city.prosperity = change.new_value;
                        console.log(`[S2-09] ${city.name} prosperity: ${change.old_value} -> ${change.new_value} (${change.delta > 0 ? '+' : ''}${change.delta})`);
                    } else if (change.metric === 'unrest') {
                        city.unrest = change.new_value;
                        console.log(`[S2-09] ${city.name} unrest: ${change.old_value} -> ${change.new_value} (${change.delta > 0 ? '+' : ''}${change.delta})`);
                    }
                });

                // Update marker color based on new values
                marker.setStyle({
                    fillColor: this.getCityColor(city.prosperity, city.unrest)
                });

                // Update popup content
                marker.setPopupContent(`
                    <div class="city-popup">
                        <h4>${city.name}</h4>
                        <p><strong>Region:</strong> ${city.region}</p>
                        <p><strong>Prosperity:</strong> ${city.prosperity}</p>
                        <p><strong>Unrest:</strong> ${city.unrest}</p>
                    </div>
                `);

                // Log notable events
                if (cityDiff.events.length > 0) {
                    console.log(`[S2-09] ${city.name} events:`, cityDiff.events);
                }
            });
        },

        getCityColor(prosperity, unrest) {
            // Color based on prosperity and unrest
            // High prosperity + low unrest = green
            // Low prosperity or high unrest = red/orange
            if (prosperity > 70 && unrest < 20) return '#2ecc71'; // green
            if (prosperity > 50 && unrest < 40) return '#3498db'; // blue
            if (prosperity > 30) return '#f39c12'; // orange
            return '#e74c3c'; // red
        },

        getCityIconClass(prosperity) {
            if (prosperity > 70) return 'city-prosperous';
            if (prosperity > 40) return 'city-moderate';
            return 'city-struggling';
        }
    }));
});
</script>
{% endblock %}
