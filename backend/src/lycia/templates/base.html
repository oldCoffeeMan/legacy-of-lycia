<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Legacy of Lycia{% endblock %}</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='/css/main.css') }}">

    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Legacy of Lycia</h1>
            <div class="header-right">
                <div class="game-info" x-data x-init="$watch('$store.game.tick', value => {})">
                    <span class="tick-counter">Turn: <strong x-text="$store.game?.tick || 0">0</strong></span>
                </div>
                {% if player %}
                <div class="player-info">
                    <a href="/profile" class="player-name">{{ player.username }}</a>
                    <form method="POST" action="/logout" style="display: inline;">
                        <button type="submit" class="btn btn-logout">Logout</button>
                    </form>
                </div>
                {% endif %}
            </div>
        </header>

        <main class="app-main">
            {% block content %}{% endblock %}
        </main>

        <footer class="app-footer">
            <p>Ancient Lycia Strategy Game - Open Source Project</p>
        </footer>
    </div>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
