version: "3.9"
services:
  db:
    container_name: lycia-postgres
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: lycia
    ports: ["5432:5432"]
    volumes:
      - ../volumes/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports: ["6379:6379"]

  backend:
    build: ../backend
    command: uvicorn src.lycia.app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/lycia
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../backend:/app
    ports: ["8000:8000"]
    depends_on: [db, redis]
